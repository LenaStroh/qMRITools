name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2021a
      - uses: matlab-actions/run-tests@v2
        with:
          source-folder: matlab
          select-by-folder: tests
